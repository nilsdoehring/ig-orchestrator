        body_verbose: "# IONOS Visual Identity\n\nSource: IONOS Style Guide v2.2\n\n## Color Palette\n\n### Primary Colors (always available)\n\n| Name | Code | HEX | Role |\n|------|------|-----|------|\n| IONOS Blue | B6 | #003D8F | Logo, primary brand anchor. Frames the brand together with Dark Midnight. |\n| Sky | S3 | #11C7E6 | Brand CTA, bold accents. Adds boldness and vibrance — use to direct eyes. One CTA per section maximum. |\n| Dark Blue | B7 | #0B2A63 | Background specifically for the white logo. |\n| Dark Midnight | B8 | #001B41 | Primary text color for screen — softer than pure black, on-brand. |\n| Cloud | C1 | #F4F7FA | Light backgrounds, subtle containers. |\n| Blue Black | B9 | #02102B | Base of the basic blue gradient; deep backgrounds. |\n| White | — | #FFFFFF | Standard white. |\n\nPrint only: Cool Black #0A121C (deeper print black), pure Black #000000 for body text in print.\n\n### Secondary Colors (prior approval required)\n\nSecondary colors require explicit approval. They only work when the surrounding environment already reads as unmistakably IONOS: logo visible, blues dominant at >60% of the color space. Control their proportion and combine with the primary palette.\n\n| Name | Code | HEX | Role |\n|------|------|-----|------|\n| Amber | Y3 | #FFAA00 | Price badges, illustrations |\n| Purple | P4 | #D746F5 | Illustrations; also doubles as the AI gradient magenta end |\n| Green | G3 | #12CF76 | Success/status indicators in UI, illustrations |\n| Rose | R3 | #FF6159 | Error/value badges, illustrations |\n\n## Color Hierarchy Rules\n\n1. Lead with IONOS Blue and Dark Midnight — these anchor the brand and communicate trust.\n2. Sky is directional, not decorative. It should point somewhere: a CTA button, a key statistic, a focal element. One Sky element per section maximum. Overusing it turns a signal into noise.\n3. Secondary colors need brand context. The surrounding composition must already feel unmistakably IONOS. If blues are not dominant, drop the secondary color entirely.\n4. Cloud and White are backgrounds, not brand colors — they provide breathing room.\n\n## WCAG AA Contrast (pre-approved combinations)\n\n| Combination | Ratio | Status |\n|-------------|-------|--------|\n| White on Dark Midnight #001B41 | 14.5:1 | Passes AAA |\n| Dark Midnight on White | 14.5:1 | Passes AAA |\n| Dark Midnight on Cloud #F4F7FA | ~14:1 | Passes AAA |\n| White on Dark Blue #0B2A63 | 10.4:1 | Passes AA |\n| White on IONOS Blue #003D8F | 4.07:1 | Passes AA for large text only — verify at small sizes |\n| Black on Sky #11C7E6 | ~3.5:1 | Passes AA for large text — verify at small sizes |\n\n## Typography\n\n| Typeface | CSS Token | Character | Primary Use |\n|----------|-----------|-----------|-------------|\n| Overpass | --font-title | Persuasive, guiding, impressive | Headlines (h1–h3), pull quotes, display text |\n| Open Sans | --font-base | Informative, reasonable, universal | Body text, UI labels, buttons, navigation |\n| Overpass Mono | --font-code | Technical, structured | Code snippets, specifications |\n\nDecision rule:\n- Impact / emotion / grabbing attention → Overpass\n- Legibility / utility / information → Open Sans (default when unsure)\n- Technical / code / specs → Overpass Mono\n\nRules:\n- Overpass weights: Regular (400) and Semibold (600) only — no Bold weight in the brand system\n- Open Sans weights: Regular (400), Semibold (600), Bold (700)\n- Do not use Overpass below ~20px — legibility degrades at small sizes\n- Do not mix Overpass and Open Sans within the same text block\n- Small uppercase labels: 0.56px tracking (Figma spec)\n\n## Background Treatment (Illustrations & Animations)\n\n- No technical grid lines. No dot grids, hairlines, blueprint cross-hatches, or engineering-paper textures as background decoration.\n- No decorative lines. No sweeping curves, diagonal accent lines, circuit-trace paths, or geometric line-art behind content.\n- Solid or gradient only. Use a flat brand color or a two-stop linear/radial gradient between brand hexes (e.g. #003D8F → #001B41, or #02102B → #001B41). A subtle vignette or radial fade is acceptable.\n- Content carries the energy. Motion, color, and product detail earn the viewer's attention — not background ornamentation.\n- \"Technical feel\" brief: reach for typography weight, content density, or product-screen detail — NOT grid lines or dot patterns.\n\n## Feature-Highlight Composition (IONOS Pop-Out)\n\nWhen a brief signals highlight / spotlight / showcase / demonstrate, or describes a user-action → result flow:\n\n- Main frame = the OUTPUT. What the feature produces — the generated result, the deployed page, the finished dashboard. Place center-right. Dense, content-rich. Dark navy surface typical for AI/premium contexts.\n- Pop-out = the INPUT / affordance. What the user typed, clicked, dragged, or said. Always the user side of the interaction — never the result. Canonical form: a rounded-pill chat input with typed prompt text.\n- Intersection (non-negotiable): the pop-out overlaps the main frame's left (canonical) edge by 25–40% of the pop-out width. A pop-out floating clear is wrong. Fully inside reads as a modal.\n- Contrast: light pop-out on dark main frame (white surface, soft drop shadow, no border). Let value contrast do the layering work.\n- Pop-out width: ~50–60% of the main frame width. Pop-out height: ~25–40% of main frame height.\n- Single pop-out per highlight. Multiple pop-outs dilute focus.\n- Animation sequence: pop-out enters first (slide up + fade + scale), main frame materializes second with staggered springs.\n\n## AI Feature Colors\n\nUse ONLY for genuinely AI-driven affordances: prompt inputs, generate/improve-with-AI actions, AI result callouts, AI badges. Never for ordinary CTAs — those stay on brand blue/sky.\n\nGradient direction: blue → magenta, always 45° static angle. Never animate the gradient angle.\n\n| Token | Hex |\n|-------|-----|\n| ai-primary-start (blue) | #095BB1 |\n| ai-primary-end (magenta) | #D746F5 |\n| ai-subtle-start (light) | #FAE7FE |\n| ai-subtle-end (light) | #FFFFFF |\n| AI accent / semantic-ai | #B410E7 |\n\nPrimary AI CTA: `background: linear-gradient(45deg, #095BB1, #D746F5); color: #fff;`\nSubtle AI surface (prompt inputs, generating state): `background: linear-gradient(120deg, #FAE7FE, #FFFFFF);`\n\nAI loading state (mandatory): every AI interaction must include a visible generating state between trigger and result. Use ai-subtle as a calm animated background (slow oscillation). Minimum 10–15 frames at 30fps before result reveal. Never cut directly from action to result.\n\nUDS component: `<Button concept=\"ai\" variant=\"primary\">` — variants: primary (full gradient bg + white text), secondary (gradient border + text), tertiary (gradient text only).\n\n## Logo Rules\n\n- Name: IONOS — always all-caps, never \"Ionos\"\n- Clear space: greater than the width of the letter N on all sides\n- Minimum size: 3.2mm (print) / 16px (screen)\n- Light background: IONOS Blue (#003D8F) logo\n- Dark background: white logo on Dark Blue (#0B2A63)\n- Nlement: distinctive 26° inclination derived from the N\n- Celebrity Backdrop: scaled Nlements protruding from the lower right of the composition\n- Forbidden modifications: no drop shadows, no outlines, no transformation or distortion, no complex backgrounds"
