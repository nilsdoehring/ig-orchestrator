        label: Image style
        verbatim_required: false
        has_two_registers: false
        body_compact: null
        body_verbose: "# IONOS Image Style Guidelines\n\nSource: UDS Image Generation Service rules\n\n## Overall Tone\n\nProfessional, trustworthy, optimistic, modern. Warm approachability — not cold or corporate. People look confident and capable. Environments feel lived-in, real, and inviting. Bright, airy, and uplifting — never dark, moody, or dramatically shadowed.\n\n## Image Types\n\nIdentify the correct type before generating. If ambiguous, prefer portrait for person-focused briefs, scenario for product-focused briefs.\n\n| Type | Use when | Key framing rule |\n|------|----------|-----------------|\n| avatar | Square (1:1) crop for profile/card use. Face is focal point. | Face 100% visible — full forehead to chin, no cropping. Vary shot distance and camera angle across generations. Do not specify lighting or camera equipment. |\n| person-scenario | Subject is mid-action in their environment; what they are doing tells the story. | Long shot (full body head-to-floor) is the default. Face 100% visible. Subject engaged mid-action, never posed. Waist shot only if context still shows. No symmetrical framing, no plain backdrop. |\n| portrait | Subject faces the camera in a professional or personal environment; identity and context tell the story. | State face anchor first in every prompt. Framing must be stated positively (see Face and Body Framing Rule). Component-side placement rule applies. |\n| scenario | Product, device, or digital interaction is the focal point; people are secondary or partial. | Screen/device is the hero. People cropped, blurred, or backgrounded — face must NOT be visible and in focus. Depth of field sharpens the product interaction. |\n\n## Portrait: Component-Side Placement\n\nWhen the brief names a UI component AND specifies a side (left/right):\n- Left: subject anchored in the left third, body and gaze angled slightly right toward the text column\n- Right: subject anchored in the right third, body and gaze angled slightly left toward the text column\n\nState this explicitly in the prompt: \"person standing in the left third of the frame, body and gaze angled slightly to the right.\"\n\n## Module Bias\n\nThe named UI module biases scale/framing. Module fills what the brief leaves open — never overrides explicit brief settings.\n\n| Module | Default type | Scale / framing |\n|--------|-------------|-----------------|\n| columns | follow brief | Medium scale — self-contained, balanced, even margins. Must read at a glance next to sibling columns. |\n| customer_testimonial | photoreal | Full-bleed background. Environmental person-scenario or scenario. Leave a calm negative-space region (keep dead-center clear) for an overlaid quote/name card. Not a tight face close-up. |\n| textmedia | follow brief | Flexible — medium to full scale depending on brief and dimensions. |\n| testimonial_slider | photoreal, avatar | Head-and-shoulders avatar (image-type-avatar). 512×512. Companion asset if present: product cutout or a small scenario vignette. |\n\n## Lighting\n\nNatural and varied — never default golden-hour treatment:\n- Office: cool-neutral morning light\n- Cafe: bright window light\n- Workshop: soft industrial ambient\n\nColor temperature: 5000–6500K. Clear tonal contrast between subject and background. The aesthetic is bright, natural, and vivid — airy and uplifting. Never flat/uniformly lit. Never dark or moody.\n\nDo not specify camera equipment or brand names in prompts. Let the model draw from its photographic repertoire.\n\n## Color Strategy\n\n- Backgrounds: warm neutrals — cream, sand, light wood, soft white, natural materials\n- Props / objects: 2–3 saturated accent colors for visual dynamism — cobalt, terracotta, forest green, mustard, burgundy\n- IONOS brand colors (#003D8F, #11C7E6): apply only when the brief explicitly requests them; otherwise let natural object and environment colors drive the palette\n\n## Character Diversity (mandatory — always encode explicitly)\n\nNever leave character demographics undefined. Apply these pools when the brief does not specify.\n\nEncode all chosen characteristics positively in the prompt, early in the prompt (e.g. \"a Black woman in her 40s with average build, standing in...\"). Never place demographics in negativePrompt.\n\n### Ethnicity pools\n\nDefault (no market signal):\n- White / Northern-European ~80%\n- Black / African descent ~15%\n- East or SE Asian ~10%\n- South Asian ~5%\n\nGermany / US:\n- White / Northern-European ~70%\n- Black / African descent ~15%\n- East / SE Asian ~10%\n- South Asian ~5%\n\nSpain / Italy: Mediterranean / Latin-European ~65% — use \"olive complexion and dark hair\" not \"Latino\" or \"Hispanic\"\n\nFrance: White/French-European ~55%, North African/Maghrebi ~20%, Black ~15%, East/SE Asian ~10%\n\n### Body shape (role-specific)\n- Manual trades: \"stocky build\" or \"solid, muscular build\"\n- Office work: \"average build\" or \"lean build\"\n\n### Age and gender\n- Default age: 30s–50s for working adults unless context suggests otherwise\n- Gender: vary across image sets; choose based on narrative context\n\n## Environment Storytelling\n\n- Lived-in backgrounds: density and disorder appropriate to each profession. Workshops show works-in-progress and scattered tools; food service shows busy counters; creative studios show reference materials and partial projects.\n- Object interaction: characters hold or actively engage with profession-relevant items. This is the strongest authenticity signal — never empty or crossed hands.\n- Depth layering (three planes): colorful foreground object as bokeh near lens → sharp subject in middle plane → densely enumerated background elements softly blurred.\n- Characters: mid-shift appearance — hair worn effortlessly, functional workwear showing appropriate wear, genuine expressions either engaging the camera or focused on tasks.\n\n## Prompt Construction Order (portrait / person-scenario)\n\n1. Face anchor + camera distance (e.g. \"full face clearly visible from hairline to chin, waist-up shot showing complete upper body\")\n2. Character details (ethnicity, age, body shape, attire)\n3. Background density (environment description)\n4. Lighting (natural source, color temperature)\n5. Natural appearance (mid-shift look, genuine expression)\n6. Photography style\n7. Foreground bokeh last (only for wider shots)\n\n## Face and Body Framing Rule\n\nAlways state framing POSITIVELY in the prompt — never in negativePrompt. Negative prompts are weak composition signals under the model center-crop bias. Use positive instructions:\n- \"full face visible from hairline to chin, waist-up shot showing complete upper body\"\n- \"full body in frame from head to floor\"\n- Portrait on landscape ratio: \"full face clearly visible from hairline to chin, extra-wide establishing shot, character occupying one vertical third of the frame, full body head to floor visible\"\n\n## Standard Negative Prompt Baseline\n\nAlways include:\n\"text, watermark, UI chrome, distorted hands, extra fingers, oversaturated, low quality, jpeg artifacts, readable screen text, readable whiteboard text, legible labels, Apple logo, Nike logo, brand logo, corporate logo, product logo, visible logo, dark moody lighting, flat shadowless lighting, all-grey muted palette\"\n\n## Cutout Requirements\n\n- Single clear subject (object, device, person, or motif) centered on a PLAIN, evenly lit, high-contrast background — so the matting model produces a clean alpha edge\n- Silhouette must be unambiguous: avoid cluttered backgrounds, subject touching frame borders, or semi-transparent elements such as smoke or glass\n- Background removed entirely → transparent PNG\n- Aesthetic: cool, premium, understated — aligned with IONOS style\n\n## Aspect Ratio and Crop Safety\n\nMap requested pixel dimensions to nearest standard ratio: 1:1, 16:9, 4:3, 3:2, 9:16, 2:3, 3:4.\n\nCrop safety: the service renders a square then center-crops to the target ratio. Landscape targets trim top/bottom; portrait targets trim left/right — adjust subject positioning to keep key elements in the surviving central band."
