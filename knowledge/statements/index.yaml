  elevator_pitch:
    file: knowledge/statements/elevator-pitch.md
    rows:
      -
        key: deploy_now.elevator_pitch
        ordinal: 1
        label: Elevator Pitch
        verbatim_required: false
        has_two_registers: true
        body_compact: Deploy Now combines secure IONOS hosting with Git workflows, allowing developers to launch web projects directly from GitHub using frontend frameworks and static site generators.
        body_verbose: Deploy Now ist die neueste Produktinnovation von IONOS im Bereich Webhosting. Die Zielgruppe sind Entwickler, die professionell Websites erstellen. Deploy Now kombiniert sicheres Hosting mit der Flexibilität einer Git-Entwicklungsumgebung. Mit Deploy Now können Developer ihre Webprojekte direkt von ihren GitHub-Accounts launchen. Dies spart Zeit und ermöglicht, Hosting nahtlos in Workflows einzubinden. Das Einrichten von Deploy Now ist dank eines dev-freundlichen, übersichtlichen Interfaces besonders einfach und schnell erledigt. Deploy Now funktioniert mit allen gängigen Frontend Frameworks und Static-Website-Generatoren.
        usage_condition: null
        scope:
          product: Deploy Now
          market: null
          audience_segment: null
          language: null
        broadcast_asserted: []
        source_locator: section Elevator pitch, page 1
      -
        key: domains.elevator_pitch
        ordinal: 1
        label: Elevator Pitch
        verbatim_required: false
        has_two_registers: true
        body_compact: IONOS bietet eine große, günstige Auswahl an klassischen und neuen Domain-Endungen (TLDs) für jeden Zweck, inklusive kostenloser Features wie E-Mail, SSL, 24/7 Kundenservice und privater Registrierung.
        body_verbose: "Den passenden Domainnamen zu wählen ist der erste wichtige Schritt, um im Web erfolgreich zu sein. Eine Domain, die einfach zu merken ist, fungiert als Adresse und repräsentiert zugleich die Marke. Bei IONOS finden Nutzer eine große Auswahl an Domain-Endungen zum günstigen Preis und für jedes Anwendungsszenario. Von klassischen Endungen wie .com und .de bis hin zu neuen und überraschenden TLDs .surf oder .bier. So bleiben Kunden jederzeit flexibel, egal ob es dabei um das eigene Unternehmen, einen Onlineshop oder eine private Website geht.\n\nEine Domain von IONOS beinhaltet immer kostenlose Features wie ein E-Mail-Postfach, ein SSL-Zertifikat und 24 Stunden persönlichen Kundenservice durch unsere Experten, an sieben Tagen die Woche. Die Privatsphäre unserer Kunden liegt uns besonders am Herzen, weshalb eine private Registrierung bei allen verfügbaren Domainnamen gewährleistet ist."
        usage_condition: null
        scope:
          product: Domains
          market: null
          audience_segment: null
          language: null
        broadcast_asserted: []
        source_locator: section Elevator pitch, page 1
      -
        key: elevator_pitch
        ordinal: 1
        label: Elevator Pitch
        verbatim_required: false
