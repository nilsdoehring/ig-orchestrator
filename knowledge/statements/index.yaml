        body_compact: null
        body_verbose: "The AI CRM Manager is a lightweight CRM specifically built for micro businesses, such as trades, freelancers, and local service providers with 1 to 5 employees, as well as solo self-employed professionals. Positioned as \"a smart customer manager that runs itself,\" it is designed for users who lack a dedicated sales team and have no prior CRM experience. The platform eliminates setup complexity and automatically centralizes contacts, emails, notes, documents, and deals into one chronological view. Its standout feature is a built-in AI layer that does the heavy lifting: it drafts tailored emails in the user's personal style, proactively flags dormant customers for reactivation, and surfaces daily priorities directly on a daily dashboard"
