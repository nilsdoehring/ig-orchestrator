  tone_of_voice:
    file: knowledge/statements/tone-of-voice.md
    rows:
      -
        key: migrated.tone_of_voice
        ordinal: 1
        label: Tone of voice
        verbatim_required: false
        has_two_registers: false
        body_compact: null
        body_verbose: "IONOS\n\nThe IONOS communication style is professional, direct, and deeply rooted in technology. It prioritizes clarity and functionality above all else, reflecting a brand that provides the essential digital infrastructure for businesses. The style is minimalist and efficient, stripping away unnecessary fluff to focus on the user's specific goals and the technical reliability of the services provided. Every piece of communication should feel like a tool—useful, precise, and high-quality.\n\nThe formality level is high and corporate. IONOS maintains a respectful, professional distance that signals stability and expertise. It does not attempt to be the user's 'friend' but rather their most reliable 'partner'. In English, this means avoiding contractions and casual phrasing. In German-speaking markets, the formal 'Sie' is the absolute standard. It speaks with the weight of an established industry leader rather than the experimental tone of a casual startup.\n\nThe tone is authoritative, visionary, and reassuring. It aims to inspire confidence by showcasing its immense scale and technological prowess. The brand voice should make the user feel that their digital presence is in safe, expert hands. By using imagery of vast, connected cityscapes and people looking toward the horizon, the brand positions itself as a guide to the future of digital business, offering a 'big picture' perspective that is both grounded and aspirational.\n\nBe concise and get straight to the point.\nUse professional, industry-standard terminology.\nMaintain a clean, organized structure in all communications.\nEmphasize reliability and global reach.\nUse instructional and functional language (e.g., 'Document moved to Brand Portal').\n\nAvoid slang, colloquialisms, or overly informal greetings.\nDo not use cluttered or overly complex sentence structures that obscure the main message.\nAvoid emotional appeals that feel 'soft' or vague; keep the focus on tangible professional benefits and technical excellence.\n\nFocus on themes of connectivity, digital transformation, and professional empowerment.\nUse active, confident verbs that imply progress and stability."
        usage_condition: null
        scope:
          product: null
          market: null
          audience_segment: null
          language: null
        broadcast_asserted: []
        source_locator: migrated from a legacy briefing column
