      -
        key: migrated.product_description.ai_document_manager
        ordinal: 1
        label: Product description
        verbatim_required: false
        has_two_registers: false
        body_compact: null
        body_verbose: "AI Document Manager\nCommercial Product Briefing\n Internal Use  |  July 2026\n\nWhat Is It?\nAI Document Manager is IONOS's new AI-native product that turns a small business's accumulated documents into a searchable, queryable knowledge base — automatically. It captures, organises, and understands every business document from the moment it arrives, then lets users ask questions, extract data — without ever digging through a folder. Generation of briefs and other outputs is planned for a future phase.\nIn short: it replaces three tools — cloud storage, document scanner, and AI search assistant — with one product (AI-generated outputs, such as briefs and slide decks, are coming in a later phase) running entirely on EU infrastructure.\n24.5M\nSMBs in the EU (target market)\n93.6%\nare micro-enterprises (1–10 employees)\n~€25/mo\ntarget mix ARPU (IONOS portfolio)\n100% EU\nAll AI processing on EU infrastructure\n\n\nThe Problem We Are Solving\nEuropean small businesses are drowning in documents they cannot use. Invoices, contracts, delivery notes, scans, and email attachments accumulate across phones, inboxes, and hard drives — and become invisible the moment they are stored.\n\n55% of European SMBs spend over 40% of their working time on administration\n\"I know we have it, but I cannot find it\" — followed by 30 minutes of searching — is the default experience\nExisting storage tools (Dropbox, OneDrive) require users to name files, build folders, and remember where things went\nExisting AI tools (Copilot, ChatGPT) require users to manually curate a corpus before they work\nNo competitor in the EU market closes the loop from document intake to actionable insight in a single product\n\nWho We Are Selling To\nPrimary audience: European SMBs with 1–10 employees in service-oriented industries. The three segments below account for the largest addressable base by document volume.\nPrimary Target Segments\nTrades & Property Services\nLargest segment by document volume\nConsulting & Professional Services\nHighest value per AI interaction\nReal Estate & Property Management\nStrongest legal-retention needs\nCleaning firms, construction, landscaping, roofing, facility management. High daily volume of inbound paperwork: supplier invoices, delivery notes, subcontractor agreements, site photos.\nBusiness consulting, IT services, HR, coaching, energy consulting. Accumulates years of client proposals, contracts, meeting notes, and deliverables. Needs to retrieve and reuse past work instantly.\nAgents, property managers, holiday rental operators. High-volume documents tied to long-lived assets: rental contracts, handover protocols, tenant correspondence, regulatory filings.\n\n\nBuyer Personas\n\nSolo Service Provider\nTradesperson, cleaner, photographer, freelancer\nPain: Documents pile up on the phone, in the van, in unread emails. No time or system to file anything.\nNeeds: One-tap mobile capture, automatic classification, instant retrieval — no folder structure required. Price-sensitive, mobile-first.\n\n\nSmall Business Owner-Operator\nConsulting, IT, real estate, property management\nPain: Years of client documents across multiple drives, inboxes, and folders. 30-minute searches are the norm.\nNeeds: Conversational access to the whole library, structured data extraction, AI-summarised answers before meetings.\n\n\nOffice Administrator\nBack-office for trades, professional services, or SMB teams\nPain: Is the human search engine of the company — constantly asked \"where is X?\" or \"what did we agree with Y?\"\nNeeds: The system takes over: structured organisation by client and project, proactive deadline alerts, automatic invoice data extraction.\n\n\nValue Proposition & Key Customer Benefits\nOne product. Three things customers currently pay separate tools for today — with a fourth on the roadmap.\n📥 Capture\nDocuments arrive through any launch channel — web upload, desktop sync, or mobile capture. Nothing needs to be filed manually.\n🗂️ Organise\nAI automatically classifies 134 document types (across 9 domains), extracts key fields, links entities across files, and routes everything into the right entity view.\n💬 Ask\nUsers ask questions in plain language. Answers come back with cited sources — specific document and page. Cross-document reasoning spans hundreds of files at once.\n\n\nFive Benefits That Matter to Customers\nFind any document or piece of information in seconds — not 30-minute search sessions\nAsk \"What did I agree with Mayer GmbH in March?\" and get the answer with a link to the exact contract page\nNever lose a document again — every file is automatically named, classified, and searchable from day one\nPhotos captured via the mobile app are named, classified, and searchable instantly; files added via web upload or desktop sync are stored and organised the same way, with no manual filing\nKnow what you owe and when — contractual deadlines and renewal dates are surfaced automatically across all stored documents\nNotice periods, rent reviews, payment terms — extracted and tracked without any manual input\nGet up to speed on any client in minutes — ask IONOS GPT to summarise everything in an entity view\nProposals, contracts, correspondence, notes — summarised conversationally, on demand, through Q&A\nFull GDPR compliance out of the box — all AI processing runs on EU infrastructure, DPA is automatic, no US data transfers\n\nGo-To-Market\nPositioning Line\n\"The fastest path from paperwork to decision — handled by AI.\"\n\nThe product is positioned within the IONOS Momentum KI suite — meaning sales conversations can upsell to AI CRM, AI Contract Manager, and AI Knowledge Hub. The AI Document Manager is both a standalone product and a natural entry point into the broader suite.\nLaunch Scope & Timeline\nBrand\nMarkets\nLaunch Date\nSTRATO\nDE, NL, SE\n Oct 1, 2026\nIONOS\nDE, FR, ES, IT, UK, US, CA, MX\n Oct 1, 2026\n\n\n\n\nPricing Portfolio (IONOS & STRATO)\nTwo brands, three tariffs each. Differentiated by storage size and included user seats only — every AI feature is available on every tier from day one. Note: at launch, automatic OCR and indexing apply only to documents captured via the mobile app; images and scans uploaded through the web uploader are stored but not indexed or searchable.\nAI_DMS_Pricing_Portfolio_v1_3\nIONOS — AI Document Manager\n\n\nStarter\nProfessional\nAdvanced\nMonthly price (gross)\n€19/month\n€29/month\n€49/month\nStorage\n20 GB\n100 GB\n500 GB\nIncluded users\n1 user\n3 users\n5 users\nIONOS/Strato GPT\n✓ Free\n✓ Free\n✓ Free\nMCP access\nAdd-on (+€9)\nAdd-on (+€9)\n1 client incl.\nContract term\nMonth-to-month\nMonth-to-month\nMonth-to-month\n\n\nStrato — AI Document Manager\nIdentical product and feature set. Lower entry price consistent with Strato's brand positioning in Germany, the Netherlands, and Sweden.\n\n\nStarter\nProfessional\nAdvanced\nMonthly price (gross)\n€15/month\n€25/month\n€45/month\nStorage\n20 GB\n100 GB\n500 GB\nIncluded users\n1 user\n3 users\n5 users\nIONOS/Strato GPT\n✓ Free\n✓ Free\n✓ Free\nMCP access\nAdd-on (+€9)\nAdd-on (+€9)\nIncl. / 1 client incl.\nContract term\nMonth-to-month\nMonth-to-month\nMonth-to-month\n\n\nPricing Logic\nNo feature walls — differentiation is storage and headcount only. Customers receive the full AI stack from the entry price.\nUpgrade triggers are natural: outgrowing storage or adding team members. No artificial restrictions force premature upgrades.\nStarter at €19 signals AI value while staying below the psychological €20 commodity-storage floor.\nProfessional at €29 includes 3 seats — owner + admin + colleague — covering the typical SMB working unit with no extra cost.\nAdvanced at €49 includes one external MCP connection (for IONOS/Strato GPT or other AI tools) and 5 seats.\n\nNaming\nAll names approved and localized: Momentum Naming Decisions\nAvailable Add-ons\nAdd-on\nPrice\nAvailable on\norderable\nAdditional full user\n+€5 / user / month\nAll tiers\nMultiple times\nExternal MCP client\n+€9 / client / month\nStarter & Professional (Advanced: 1 client included)\nMultiple / single (TBC)\n\n\nNote: IONOS GPT / Strato GPT is bundled free on all tiers for the contract owner. Additional users access GPT capabilities through the AI DMS interface — not as a standalone product.\nTarget mix ARPU (IONOS): ~€25/month at a 65% / 25% / 10% tier distribution (Starter / Professional / Advanced).\nCross-selling [in-progress]\nCross-selling concept still to be discussed. Following considerations:\nNK Cross-selling: above mentioned add-ons as direct next upsell to the respective standalone tariff\nAI Document manager standalone tariff ‘bundeable’ with other KI products, potentially with Communication products.\n\nChannel offers  [in-progress]\nPrimary GTM motion is direct online via ionos.de (and equivalent brand sites), where the product is positioned as a new division under the Momentum KI suite. The entry point is the existing IONOS customer base and inbound traffic driven by search and performance marketing.\n\nNew customer (NK) offer: 1 month free on all tiers\nCS-online offer: 3 months free\nAgent channel offer: 50% off for 3 or 6 months\n\n\nWhy We Win — Competitive Positioning\nThree claims that are uncontested in the European SMB market today.\n1  Full AI from €19 — no feature gates, no document caps, no credits\nEvery direct competitor either gates AI to higher tiers, imposes document limits, or bills AI consumption as credits. d.velop charges €39 before AI turns on. fileee caps at 150 documents/month on their mid-tier. PaperOffice charges €69 for 40,000 credits. IONOS gives the complete AI stack on every plan from the entry price.\n\n2  The only EU-sovereign, month-to-month, multi-seat offer in the segment\nDropbox is US-hosted. d.velop and fileee are EU-hosted but annual-only or document-capped. PaperOffice starts at €69. No competitor combines GDPR-native infrastructure + flexible contract + included seats (1/3/5) at this price point. That combination is a clean, uncontested claim in the German market.\n\n3  A price ladder with no obvious attack surface\nAt €19 IONOS undercuts d.velop Basic (€27, no AI) and PaperOffice Starter (€69). At €29 it beats Revver Basic ($25/user per-seat — a 3-person team pays $75) with a better AI feature set. At €49 it is still well below PaperOffice Plus (€180). Competitors either cannot match on price or cannot match on EU + AI depth simultaneously.\n\nQuick Reference: Competitive Comparison\n\n\nFull AI from entry\nEU sovereign\nMonth-to-month\nIncl. seats\nNo caps / credits\nIONOS AI DMS (€19–49)\n✓\n✓\n✓\n1 / 3 / 5\n✓\nd.velop (€27–55)\nFrom €39\n✓ EU\nAnnual only\nPer user\n✓\nfileee (€15–130)\n✓ (limited)\n✓ EU\n✓\nPer user\n150 docs/mo cap\nPaperOffice (€69–499)\n✓\n✓ EU\n✓\n20–200 users\nCredit-based AI\nDropbox (from €17/user)\nAdd-on\n✗ US\n✓\nPer user\n✓\n\n\n\n\nQuick Reference\nAudience   European SMBs, 1–10 employees, service sectors\nCore Pain   Documents stored but invisible — search costs hours, not seconds\nCore Value   Capture → Organise → Ask, in one EU-sovereign product (Generate: coming in Phase 2)\nIONOS Pricing   €19 / €29 / €49 per month (Strato: €15 / €25 / €45)\nKey Claim   Full AI on every plan · EU-sovereign · Month-to-month · No feature gates\nLaunch   Strato DE/NL/SE: 1 Jul 2026  ·  IONOS multi-market: 2 Aug 2026"
        usage_condition: null
        scope:
          product: AI Document Manager
          market: null
          audience_segment: null
          language: null
        broadcast_asserted: []
        source_locator: migrated from a legacy briefing column
