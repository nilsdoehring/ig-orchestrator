      -
        key: migrated.writing_style.de-DE
        ordinal: 1
        label: Writing style
        verbatim_required: false
        has_two_registers: false
        body_compact: null
        body_verbose: "- Anrede: **Sie** (formal). Nie „du\" außer in ausdrücklich anderslautenden Produktkontexten.\n- „Wir\" minimieren – kundenzentriert formulieren („Profitieren Sie von…\" statt „Wir bieten Ihnen…\").\n- CTAs: **Imperativ (Sie-Form)**, max. 3 Wörter. Live-Beispiele: „Jetzt starten\", „Pakete & Preise ansehen\", „Mehr erfahren\". Kein Satzzeichen auf Buttons. Nie „Ja/Nein\"-Wahl im CTA. Sekundäre CTAs (Links im Fließtext): Länge egal, aber kein Punkt am Ende.\n- Gendergerechte Sprache: „Kundinnen und Kunden\", „Nutzerinnen und Nutzer\", „Mitarbeitende\"/„Interessierte\"/„Fachleute\" statt maskuliner Formen. Ausnahme: „Persönlicher Berater\" (PSA) bleibt als feststehender Begriff maskulin.\n- „man\"-Konstruktionen vermeiden – umschreiben in direkte Ansprache oder neutrale Formulierung.\n- Mobile First: max. 18 Wörter pro Satz.\n- E-Mail-Anrede: „Hallo, [Vorname]\" oder „Guten Tag, Herr/Frau [Name]\".\n- Aktive Formulierungen bevorzugen, Passiv vermeiden („Aktivieren Sie automatische Updates\" statt Passivkonstruktion).\n- Positive, kundenzentrierte Botschaften – keine Angst-basierte Kommunikation, kein FUD (Fear/Uncertainty/Doubt).\n- Keine Fragen in Headlines – IONOS bietet Antworten, keine Fragen. FAQ ist die einzige Ausnahme.\n- Mehrere Sätze in Headlines vermeiden. Frontloading: Keywords an den Satzanfang.\n- Ausrufezeichen: max. 2× pro Seite, nicht in Überschriften, NIE in E-Mail-Betreffzeilen (Spam-Gefahr).\n- Kommas: max. 4 pro Satz empfohlen – bei mehr lieber den Satz aufteilen. Semikolon möglichst vermeiden (nicht gut für Marketing/SEO).\n- Tone of Voice (Brand): selbstbewusst & einnehmend, freundlich & hilfsbereit, ermutigend & inspirierend. Archetype: Hero (Technologie demokratisieren). Humor nur dezent und situationsangemessen.\n- Tooltips: benutzerorientiert, kein Marketing-Ton. Fehlermeldungen: Problem + Lösung nennen, kein Humor, keine Schuldzuweisung. Alt-Text: kurz, relevant, wichtigstes Keyword einbauen wenn natürlich möglich.\n- Sie-Form transportiert bewusst Premium-Anspruch (nicht nur Höflichkeitsform).\n- Gender-Ausnahme: „Persönlicher Berater\" (PSA) bleibt als feststehender Produkt-/Rollenbegriff immer maskulin — hier NICHT gendern.\n- Barrierefreiheit: Alt-Text und Link-Titel sind Pflicht, kurz und beschreibend. Kein Alt-Text setzen, wenn das Bild keinen zusätzlichen Kontext liefert.\n- Anführungszeichen – Punkt-Platzierung: Ist der Satzteil in Anführungszeichen Teil des übergeordneten Satzes, steht der Punkt NACH dem schließenden Zeichen (\"). Ist er ein eigenständiges Zitat, steht der Punkt VOR dem schließenden Zeichen.\n\n**Anrede & Ton (Referenztabelle)**\n\n| Regel | DE |\n|---|---|\n| Anrede | **Sie** |\n| „Wir\" | Minimieren |\n| Gender (DE Live) | „Besuchern und Besucherinnen\", „Mitarbeitenden\" |\n\n**CTA-Regeln (Referenztabelle)**\n\n| Regel | DE |\n|---|---|\n| Verb-Form | **Imperativ (Sie)** |\n| Live-Beispiele | „Jetzt starten\", „Pakete & Preise ansehen\", „Mehr erfahren\" |\n| Max. Wörter | 3 |"
        usage_condition: null
        scope:
          product: null
          market: null
          audience_segment: null
          language: de-DE
        broadcast_asserted: []
        source_locator: migrated from a legacy briefing column
      -
        key: migrated.writing_style.en-CA
        ordinal: 1
        label: Writing style
        verbatim_required: false
        has_two_registers: false
        body_compact: null
        body_verbose: "- **Keine eigene Lokalisierung**: US-Inhalte 1:1 übernehmen, nur wo nötig produktseitig anpassen (siehe Localization Notes).\n- Title Case: Help Center Headlines + Hauptnavigation (Abweichung von der sonstigen US-Sentence-Case-Regel).\n- Nach Doppelpunkt: Großbuchstabe, wenn danach ein eigenständiger Satz folgt.\n- Alle übrigen Stil-Regeln (Anrede, CTA-Form, Fehlermeldungen, Ausrufezeichen etc.) wie **US** – siehe dortige Notes.\n- Ampersand (&): in Navigation erlaubt (alle Märkte nutzen es live). Sonst ausschreiben.\n- Frontloading: Keywords vorne in Headlines (gilt laut Quelle für alle Märkte).\n- Mobile First: auf Smartphone testen. Max. 18 Wörter pro Satz (Richtwert aus der Quelle, alle Märkte).\n- Fehlermeldungen (allgemein): Was ist das Problem + wie wird es behoben. Kein Humor, keine Panikmache, keine Schuldzuweisung.\n- Tooltips (allgemein): user-fokussiert, kein Marketing-Ton.\n\n**Anrede & Ton (Referenztabelle)**\n\n| Regel | CA |\n|---|---|\n| Anrede | **You** (casual) |\n| „Wir\" | Sparsam |\n| Gender (DE Live) | = UK |\n\n**CTA-Regeln (Referenztabelle)**\n\n| Regel | CA |\n|---|---|\n| Verb-Form | **Imperative** |\n| Live-Beispiele | „Get started\", „Learn more\" |\n| Max. Wörter | 3 |"
        usage_condition: null
        scope:
          product: null
          market: null
          audience_segment: null
          language: en-CA
        broadcast_asserted: []
        source_locator: migrated from a legacy briefing column
      -
        key: migrated.writing_style.en-GB
        ordinal: 1
        label: Writing style
        verbatim_required: false
        has_two_registers: false
        body_compact: null
        body_verbose: "- Anrede: **You** (formell-höflich, kein „one\").\n- CTAs: Imperativ, max. 3 Wörter. „Learn more\" statt „Find out more\". Live-Beispiele: „Learn more\", „Get started\", „View packages\".\n- Sentence case überall (keine Title Case) – Ausnahme: Help Center Headlines und Hauptnavigation können Title Case verwenden (siehe CA-Konvention, die auf US/UK-Basis aufbaut).\n- Keine Semikolons in Marketing-Texten.\n- Fehlermeldungen: mit \"Please\" beginnen – \"Please try again\" (höflicher als US).\n- E-Mail-Anrede: \"Hi [First name]\" (formeller als US).\n- ⚠️ Quellenkonflikt Oxford-Komma: Die marktspezifische Kernregel sagt „nur bei Mehrdeutigkeit setzen\", die allgemeine Sonstiges-Tabelle sagt „bei Listen mit 3+ Elementen IMMER setzen, nicht weglassen: 'SSL certificate, malware scans, and DDoS protection.'\" Bis geklärt: der zweiten, expliziteren Regel folgen (immer setzen).\n- Ampersand (&): in Navigation erlaubt (alle Märkte nutzen es live). Sonst ausschreiben.\n- Frontloading: Keywords vorne in Headlines (gilt laut Quelle für alle Märkte).\n- Mobile First: auf Smartphone testen. Max. 18 Wörter pro Satz (Richtwert aus der Quelle, alle Märkte).\n- Fehlermeldungen (allgemein): Was ist das Problem + wie wird es behoben. Kein Humor, keine Panikmache, keine Schuldzuweisung.\n- Tooltips (allgemein): user-fokussiert, kein Marketing-Ton.\n\n**Anrede & Ton (Referenztabelle)**\n\n| Regel | UK |\n|---|---|\n| Anrede | **You** (formal-polite) |\n| „Wir\" | Sparsam |\n| Gender (DE Live) | they/them |\n\n**CTA-Regeln (Referenztabelle)**\n\n| Regel | UK |\n|---|---|\n| Verb-Form | **Imperative** |\n| Live-Beispiele | „Learn more\", „Get started\", „View packages\" |\n| Max. Wörter | 3 |"
