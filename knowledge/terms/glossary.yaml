#
# Two levels: concept then terms. Concept carries definition / do_not_translate /
# governed_by / related_rule_keys exactly once; a term carries only what varies by
# naming — language, market, product, status, preference_rank, usage_note.
#
# preference_rank is meaningful ORDER, not a tiebreak. Rank 1 is the term to use. A
# shorter synonym list for one language/market than another is the source data, never
# padded to match — do not treat a missing rank 3 as an omission to fill in.
#
# do_not_translate on a concept applies to every term under it, in every language.
#
# governed_by (e.g. "IMC") means naming under this concept needs a ticket plus Brand
# Approval before use. A coding agent must NEVER invent a product or tariff name under a
# governed concept. See governed_by_requires on the concept for the same warning inline.
#
# related_rule_keys links a term to rules stating the same fact from the rule side (e.g.
# the term "White Paper" and the hyphenation rule about it) — follow them; a reviewer
# changing one and not the other is how the two tables drift apart.
#
# A term with status "definitional" is a plain glossary definition with no competing
# alternative. It is a real entry, not lesser than a preferred one.
#
# No terms with no concept assigned for this team.

