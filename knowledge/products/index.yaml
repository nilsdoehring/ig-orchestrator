shared_segments:
  allgemeine_verbraucher:
    -
      label: Allgemeine Verbraucher
      description: "Allgemeine Verbraucher: Private Anwenderinnen und Anwender, preissensitiv und teils technikaffin. Die Anwendungsfälle reichen von Hochzeits-Websites über Web- und App-Development und gemeinnützige Seiten bis hin zur Nutzung als reiner Online-Speicherplatz. Domains erwerben sie für Personal Branding, zum Schutz der eigenen Online-Identität und als Plattform für berufliche Referenzen oder ein Portfolio. Der günstige Preis ist der Hauptauslöser für den Kauf; technikaffine Kunden schätzen zusätzlich die Funktionsvielfalt."
      focus_status: primary
      targeted: true
      share_of_cases: 10
      decision_maker: Konsument selbst
      technical_level: low_to_medium
      motivations:
        - Günstiger Preis
        - Servicequalität
        - Professioneller Auftritt (werbefrei)
        - Zusätzliche Add-ons (Domain, SSL-Zertifikat, Spam-Schutz)
      pain_points:
        - Preissensitive Zielgruppe
      market: null
      source_locator: section Zielgruppe(n) | Personas, page 1
  migrated.enterprise_it:
    -
      label: Enterprise IT
      description: "Enterprise IT: Strategische IT-Entscheider in Großunternehmen mit komplexen Compliance-Anforderungen und Multi-Cloud-Architekturen. Brauchen zertifizierte Infrastruktur (ISO 27001, SOC2, C5), dedizierte Account Manager und maßgeschneiderte SLAs. Sovereign Cloud ist Schlüsselthema."
      focus_status: primary
      targeted: true
      share_of_cases: null
      decision_maker: null
      technical_level: null
      motivations:
        - Hybrid-Cloud-Strategie mit europäischem Sovereign Cloud
        - Nachweisbare Compliance für regulierte Branchen
        - Kosteneffizienz gegenüber Hyperscalern
        - Persönliche Betreuung durch dedizierte Cloud Architects
        - Exit-Strategie und Vermeidung von Vendor Lock-in
      pain_points:
        - Integration in bestehende Enterprise-Systeme komplex
        - Migrationskomplexität und Ausfallrisiken
        - Compliance-Anforderungen je nach Branche unterschiedlich
        - US-Cloud-Act-Bedenken bei amerikanischen Anbietern
        - Fehlende europäische Alternativen mit Enterprise-SLAs
      market: null
      source_locator: migrated from TargetGroup
  migrated.freelancer_agenturen:
    -
      label: Freelancer & Agenturen
      description: "Freelancer & Agenturen: Technikaffine Dienstleister, die Hosting und Server für ihre Kunden verwalten — Webentwickler, Webdesigner, DevOps und Agenturen jeder Größe. Brauchen effiziente Multi-Projekt-Verwaltung, API-Zugang und Reseller-Möglichkeiten. Suchen Lösungen, die die Bedürfnisse ihrer Kunden abdecken und die sie zugleich intern für das eigene Business nutzen können. Preissensibel, vergleichen aktiv mit Hetzner und DigitalOcean. Schätzen Automatisierung und gute Dokumentation. Kleine Agenturen und Start-ups stehen unter permanentem Kundendruck und haben oft weder Zeit noch Know-how für manuelle Problemlösung: Sie brauchen direkte Ansprechpartner statt nur einer Support-Hotline, und Benutzerfreundlichkeit wie Datensicherheit nach höchsten Standards sind für sie absolute Kauffaktoren."
      focus_status: primary
      targeted: true
      share_of_cases: 50
      decision_maker: Endbenutzer und Profis selbst
      technical_level: high
      motivations:
        - Effizienz steigern durch Automatisierung und APIs
        - Margen verbessern mit Reseller-Programmen
        - Kunden mit zuverlässiger Performance begeistern
        - Professionelle Infrastruktur ohne eigene Datacenter
        - Einfache Abrechnung und Kundenverwaltung
      pain_points:
