openapi: 3.1.0
info:
  title: IONOS Knowledge Hub API
  version: "2026-09-18"
  description: |
    The Knowledge Hub is what powers Unima's text generation pipeline: a service that turns a
    brand's and a product's own governed knowledge — voice, claims, terminology, audience, platform
    rules — into a ready-to-use system prompt, on demand, for any IONOS Group brand and any output
    platform. Call `kh/assemble` and hand its result straight to your own model call (or to our
    Text Generation API — see the sibling spec, `text-generation-api.yaml`) to get outbound copy
    that already sounds like the brand it's for, without your team maintaining a single brand
    guideline document by hand.

    Everything else on this surface is how that knowledge is looked after: uploading and reviewing
    new source material, publishing reviewed knowledge so `kh/assemble` can use it, registering the
    skills that do the writing, and reading the vocabulary (products, languages, platforms,
    audiences) a brand has on file.

    ## What each endpoint gives you

    | Endpoint | What it's for |
    |---|---|
    | `list-briefing-options` | **Start here.** Send your brand's name, get back every product, language and target group it has on file — this is how you find the values to send everywhere else on this API. |
    | `kh/assemble` | Get a brand- and product-governed system prompt for your own generation call. This is the one most integrations use. |
    | `kh/ingest` | Turn an uploaded brand or product document into reviewable one-line knowledge. |
    | `kh/publish` | Publish reviewed knowledge so `kh/assemble` starts using it. |
    | `kh/skill-upsert` | Register or update a skill — a named writing task with its own prompt and its own slice of the knowledge it's allowed to draw on. |
    | `kh/lookup` | Read the vocabulary (products, languages, platforms, audiences) available for a brand — build your own scope picker with it. |
    | `kh/lookup-publish` | Publish the current vocabulary for one of those axes. |
    | `kh/teams-publish` | Publish the brand/team directory this API partitions all of the above by. |

    ## Finding what to send

    `kh/assemble`'s `scope` fields take specific values, not free text — `"product": "hosting"`
    only works because `"hosting"` is a real product value on file for that brand. The quickest way
    to find real values for your brand is `list-briefing-options`: send your brand's name and get
    back its products, languages (with a ready-to-use locale code) and target groups. Once you also
    have your brand id from Nils, `kh/lookup` gives you the same vocabulary plus platforms, keyed
    the exact way `kh/assemble`'s `scope` expects.

    ## Getting a key

    Every call needs a header key. Reach out to **Nils** to get one issued for your team.

    ## Authentication

    Every request carries a custom header:

        ai-website-builder: <key>

    curl example:

        curl -s -X POST https://n8nwh.ionos.org/webhook/kh/assemble \
          -H "Content-Type: application/json" \
          -H "ai-website-builder: $N8N_IONOS_ORG_HEADER_AUTH_KEY" \
          -d '{
            "skill": "copywriter",
            "brand": "<your brand id>",
            "scope": { "product": "hosting", "language": "de-DE", "platform": "social" },
            "budget": 12
          }'
  contact:
    name: Nils

servers:
  # NOT `n8n.ionos.org` — that host is the n8n application itself (editor UI, credentials, the
  # REST management API) and its `/webhook/*` paths redirect to CAS SSO for an unauthenticated
  # POST. `n8nwh.ionos.org` is the dedicated webhook gateway — the same host every sibling spec in
  # this directory (image-generation-api.yaml, text-generation-api.yaml, catalog-select-api.yaml)
  # already uses — and it checks the `ai-website-builder` header directly, with no SSO involved.
  - url: https://n8nwh.ionos.org/webhook
    description: IONOS Group n8n (webhook gateway)

security:
  - headerAuth: []

tags:
  - name: discover
    description: Find your brand's real products, languages, platforms and target groups.
  - name: assemble
    description: Get a brand-governed system prompt for your own generation call.
  - name: ingest
    description: Turn an uploaded document into reviewable knowledge.
  - name: publish
    description: Publish reviewed knowledge, skills, or vocabulary so the rest of the API can use it.
  - name: lookup
    description: Read the vocabulary a brand has on file — products, languages, platforms, audiences.
paths:
  /list-briefing-options:
    post:
      operationId: listBriefingOptions
      tags: [discover]
      summary: Look up a brand's products, languages and target groups by name.
      description: |
        The starting point for a new integration: send a brand's name — the one Nils gives you
        along with your key — and get back every product, language and target group on file for
        it. Languages come back with a ready-to-use locale code (e.g. `de-DE`) — exactly what
        `scope.language` expects, and a product's name doubles as its `scope.product` value in the
        common case. A target group's name here is its display label, not necessarily the exact
        `scope.segment` key.

        Send `teams` (a list of names) instead of `team` to look up several brands in one call.

        Once you have your brand id from Nils, `kh/lookup` covers all four axes — including
        platforms, which aren't in this response — each keyed exactly the way `kh/assemble`'s
        `scope` expects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: One brand
                  required: [team]
                  properties:
                    team: { type: string, description: The brand's name, e.g. "IONOS". }
                - type: object
                  title: Several brands at once
                  required: [teams]
                  properties:
                    teams:
                      type: array
                      items: { type: string }
                      example: ["IONOS", "STRATO"]
      responses:
        "200":
          description: The brand's (or brands') products, languages and target groups.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: One-brand response
                    properties:
                      team: { type: string }
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                      languages:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            code: { type: string, description: "The locale code to use as `scope.language`, e.g. de-DE." }
                      target_groups:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                      counts:
                        type: object
                        properties:
                          products: { type: integer }
                          target_groups: { type: integer }
                          languages: { type: integer }
                  - type: object
                    title: Several-brands response
                    properties:
                      by_team:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            products: { type: array, items: { type: object } }
                            languages: { type: array, items: { type: object } }
                            target_groups: { type: array, items: { type: object } }
                            counts: { type: object }

  /kh/assemble:
    post:
      operationId: khAssemble
      tags: [assemble]
      summary: Get a brand- and product-governed system prompt.
      description: |
        Give it a skill, a brand, and the scope you're writing for — get back a system prompt
        built from that brand's own governed knowledge, ready to hand to your model call as-is.

        Behind the scenes it filters the brand's knowledge down to what the named skill is meant
        to draw on and what your scope actually applies to, ranks it, takes the strongest dozen
        entries per category (tune with `budget`), and orders it so platform- and audience-specific
        rules are stated last and win any conflict. You never see that machinery — you get one
        finished prompt, plus the receipts (`used`) showing exactly which pieces of knowledge went
        into it, so a surprising result is always traceable.

        Pair the result with our Text Generation API for a complete, brand-governed generation call
        in two hops.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill, brand]
              properties:
                skill:
                  type: string
                  description: Which writing task you're assembling a prompt for — this decides the default slice of knowledge it draws on.
                  example: copywriter
                brand:
                  type: string
                  description: The brand you're writing for. Ask Nils for your brand id if you don't have it yet.
                  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                scope:
                  type: object
                  description: |
                    What you're writing about right now. Send all four keys every time, even
                    when a value doesn't apply yet — leaving a key out asks for knowledge that
                    applies no matter what, which is the safe default, not "everything."
                  properties:
                    product: { type: [string, "null"], example: hosting }
                    language: { type: [string, "null"], example: de-DE }
                    platform: { type: [string, "null"], example: social }
                    segment: { type: [string, "null"], example: audience.ambitious_digital_starter }
                budget:
                  type: integer
                  minimum: 1
                  default: 12
                  description: How many knowledge entries per category to include at most.
                appetite:
                  type: array
                  items: { type: string }
                  description: |
                    Optional — overrides the skill's own default slice of knowledge for this one
                    call. `dimension/*` asks for a whole category of knowledge at once.
                  example: ["language/*", "product/claim_constraints"]
      responses:
        "200":
          description: The prompt, ready to use, plus what produced it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  system:
                    type: string
                    description: The finished system prompt. Hand this straight to your model call.
                  used:
                    type: array
                    description: Every piece of knowledge that made it into the prompt, for full traceability.
                    items:
                      type: object
                      properties:
                        atom: { type: string }
                        dimension: { type: string }
                        category: { type: string }
                        rank: { type: integer }
                  skill: { type: string }
                  model: { type: string }
                  appetite:
                    type: array
                    items: { type: string }
                    description: The knowledge slice actually applied — the skill's own default, or your override.
                  diagnostics:
                    type: object
                    properties:
                      fetched: { type: integer }
                      kept: { type: integer }
                      budget: { type: integer }
                      appetiteOverride: { type: boolean }

  /kh/ingest:
    post:
      operationId: khIngest
      tags: [ingest]
      summary: Turn an uploaded document into reviewable knowledge.
      description: |
        Send a source document — a comms guide, a product brief, a style guide — declaring which
        dimension it belongs to and what it covers, and get back a set of candidate one-line
        knowledge entries, ready for a reviewer to approve. This is how new brand and product
        knowledge enters the system that `kh/assemble` draws on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, dimension, document]
              properties:
                brand: { type: string, description: The brand this document is about. }
                dimension:
                  type: string
                  example: language
                  description: Which of the seven knowledge dimensions this document belongs to (brand identity, writing & tone, target group, product, language, platforms, image guidelines).
                document:
                  type: string
                  description: The document's text.
                scope:
                  type: object
                  description: What you already know this document covers — the entries proposed from it will never be broader than this.
                  properties:
                    product: { type: [string, "null"] }
                    language: { type: [string, "null"] }
                    platform: { type: [string, "null"] }
                    segment: { type: [string, "null"] }
                instruction:
                  type: string
                  description: Optional steer for this document specifically.
      responses:
        "200":
          description: Candidate knowledge entries, ready for review, plus a verdict on the run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  atoms:
                    type: array
                    items:
                      type: object
                      properties:
                        body: { type: string }
                        dimension: { type: string }
                        category: { type: string }
                        rank: { type: integer }
                        brand: { type: string }
                        product: { type: [string, "null"] }
                        language: { type: [string, "null"] }
                        platform: { type: [string, "null"] }
                        segment: { type: [string, "null"] }
                        state: { type: string, enum: [draft] }
                  drops:
                    type: array
                    description: What was left out of this document, and why — useful for tuning what you send next time.
                    items:
                      type: object
                      properties:
                        section: { type: string }
                        reason: { type: string }
                  verdict:
                    type: object
                    description: How well the run went, in plain terms.
                    properties:
                      coverage: { type: string }
                      gist: { type: string }
                      note: { type: string }
                  gates:
                    type: object
                    description: Diagnostics about the run.
                    properties:
                      intake: { type: object }
                      atoms: { type: integer }
                      drops: { type: integer }
                      perCategory: { type: object }
                      overBudget: { type: array, items: { type: string } }
                      offVocabCategories: { type: array, items: { type: string } }
                      notOneLiners: { type: integer }

  /kh/publish:
    post:
      operationId: khPublish
      tags: [publish]
      summary: Publish reviewed knowledge for a brand.
      description: |
        Send the full, current set of a brand's reviewed, approved knowledge for the dimensions
        you name — this is what `kh/assemble` reads from. Publishing is a full replace for those
        dimensions: anything not included is retired, so a rule someone withdrew stops showing up
        in every prompt from that point on, not just new ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, dimensions, atoms]
              properties:
                brand: { type: string }
                dimensions:
                  type: array
                  items: { type: string }
                  description: The dimensions this call is the current, full picture for.
                atoms:
                  type: array
                  items:
                    type: object
                    required: [atom_id, dimension, category, body, state]
                    properties:
                      atom_id: { type: string, description: Stable across republishes. }
                      dimension: { type: string }
                      category: { type: string }
                      body: { type: string }
                      rank: { type: integer }
                      product: { type: string, description: "A value, or `*` for every value on this axis." }
                      language: { type: string, description: A locale code, or `*`. }
                      platform: { type: string, description: "A value, or `*`." }
                      segment: { type: string, description: An audience key, or `*`. }
                      state: { type: string, enum: [published] }
                      source_doc: { type: string, description: Where this came from, if known. }
      responses:
        "200":
          description: What was published, and what was retired as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: integer }
                  pruned: { type: integer }
                  prunedIds:
                    type: array
                    items: { type: string }

  /kh/skill-upsert:
    post:
      operationId: khSkillUpsert
      tags: [publish]
      summary: Register or update a skill.
      description: |
        A skill is a named writing task — copywriter, ad_copywriter, a persona-profile writer, and
        so on — with its own prompt and its own declared slice of the knowledge it draws on when
        you call `kh/assemble` with it. Registering one here makes it callable by name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill, kind, prompt, appetite, model]
              properties:
                skill: { type: string, description: The name you'll pass to `kh/assemble`. }
                kind: { type: string, enum: [task, ingest] }
                brand:
                  type: string
                  description: Leave empty to make the skill available to every brand — the common case.
                  example: ""
                prompt: { type: string, description: The skill's own prompt. }
                appetite:
                  type: string
                  description: |
                    A JSON-encoded list of which knowledge this skill draws on by default
                    (e.g. `"[\"language/*\"]"`) — an include list, so being explicit about what
                    it needs is always safe.
                model: { type: string, description: Which model this skill runs on. }
      responses:
        "200":
          description: The skill is registered.

  /kh/lookup:
    post:
      operationId: khLookup
      tags: [lookup]
      summary: Read a brand's vocabulary for one or more axes.
      description: |
        Ask for a brand's current products, languages, platforms, or target groups — the values
        you can pass into `kh/assemble`'s `scope` — and get back the list, ready to build your own
        picker or dropdown with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Single axis
                  required: [brand, dimension]
                  properties:
                    brand: { type: string }
                    dimension: { type: string, enum: [product, language, platform, target_group] }
                - type: object
                  title: Several axes at once
                  required: [brand, dimensions]
                  properties:
                    brand: { type: string }
                    dimensions:
                      type: array
                      items: { type: string, enum: [product, language, platform, target_group] }
      responses:
        "200":
          description: The vocabulary for the axis or axes you asked for.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Single-axis response
                    properties:
                      options:
                        type: array
                        items:
                          type: object
                          properties:
                            value: { type: string }
                            label: { type: string }
                      count: { type: integer }
                  - type: object
                    title: Several-axes response
                    properties:
                      by_dimension:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            options:
                              type: array
                              items:
                                type: object
                                properties:
                                  value: { type: string }
                                  label: { type: string }
                            count: { type: integer }

  /kh/lookup-publish:
    post:
      operationId: khLookupPublish
      tags: [publish]
      summary: Publish the current vocabulary for one axis.
      description: |
        Send the full, current list of values for one brand and one axis (products, languages,
        platforms, or target groups) — this is what powers `kh/lookup` and the scope values
        `kh/assemble` accepts. Like `kh/publish`, this is a full replace for that axis: send an
        empty list to publish "nothing on this axis right now."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, dimension, options]
              properties:
                brand: { type: string }
                dimension: { type: string, enum: [product, language, platform, target_group] }
                options:
                  type: array
                  items:
                    type: object
                    required: [value, label]
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Present for product, language and target_group entries.
                      value: { type: string }
                      label: { type: string }
      responses:
        "200":
          description: What was published, and what was retired as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: integer }
                  pruned: { type: integer }
                  prunedValues:
                    type: array
                    items: { type: string }

  /kh/teams-publish:
    post:
      operationId: khTeamsPublish
      tags: [publish]
      summary: Publish the brand/team directory.
      description: |
        Send the current list of brand ids and names — this is the directory every `brand` value
        elsewhere on this API is resolved against.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teams]
              properties:
                teams:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
      responses:
        "200":
          description: The directory is published.

components:
  securitySchemes:
    headerAuth:
      type: apiKey
      in: header
      name: ai-website-builder
      description: |
        Custom header auth. Header name: `ai-website-builder`. Reach out to Nils to get a
        key issued.
